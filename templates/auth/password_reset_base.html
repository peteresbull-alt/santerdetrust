{% load static %}
<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}Reset Password{% endblock %} — Santerde Trust</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              azure: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
              },
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      :root {
        --onyx: #0A0A0A;
        --obsidian: #111111;
        --azure: #3b82f6;
        --azure-light: #60a5fa;
        --pearl: #F9FAFB;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: var(--onyx);
        color: var(--pearl);
        min-height: 100vh;
        overflow-x: hidden;
      }
      .bg-glow {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 80% 50% at 20% 20%, rgba(59,130,246,0.07) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59,130,246,0.05) 0%, transparent 60%);
      }
      .auth-card {
        background: var(--obsidian);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 1.5rem;
        box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      }
      input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 0.75rem;
        color: var(--pearl);
        font-size: 0.9375rem;
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        outline: none;
      }
      input:focus {
        background: rgba(255,255,255,0.08);
        border-color: var(--azure);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
      }
      input::placeholder { color: rgba(249,250,251,0.35); }
      .btn-primary {
        width: 100%;
        padding: 0.875rem 1.5rem;
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
        color: #fff;
        font-weight: 700;
        font-size: 0.9375rem;
        border-radius: 0.75rem;
        border: none;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        transition: transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(59,130,246,0.4); }
      .icon-badge {
        width: 4rem; height: 4rem; border-radius: 1rem;
        display: flex; align-items: center; justify-content: center;
        background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.25);
      }
      .note {
        background: rgba(59,130,246,0.06);
        border: 1px solid rgba(59,130,246,0.15);
        border-radius: 0.875rem;
        padding: 0.875rem 1rem;
      }
      .muted { color: rgba(249,250,251,0.55); }
      @media (max-width: 640px) { input { font-size: 16px !important; } }
    </style>
  </head>

  <body>
    <div class="bg-glow"></div>

    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center py-12 px-4">
      <a href="{% url 'landing_home' %}" class="mb-8 transition-opacity hover:opacity-80">
        <img src="{% static 'images/SanterdeTrust.png' %}?v=3" alt="Santerde Trust" class="h-12 w-auto object-contain">
      </a>

      <div class="auth-card w-full max-w-md p-6 sm:p-10">
        {% block content %}{% endblock %}
      </div>

      <a href="{% url 'login' %}" class="mt-6 text-sm muted hover:text-white transition-colors">
        <i class="fas fa-arrow-left mr-1.5"></i>Back to sign in
      </a>
    </div>

    {% include 'partials/smartsupp.html' %}
  </body>
</html>
